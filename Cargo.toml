[package]
name = "logic-gate-sim"
version = "0.1.0"
edition = "2021"
description = "Interactive logic gate visualizer and simulator with an Axum backend"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs"] }

[profile.release]
lto = true
codegen-units = 1
